name: Run all CI tests
on: [pull_request]

jobs:
  run_all_tests:
    runs-on: ubuntu-latest
    name: Full CI (style and tests)
    container: jcsda/docker-gnu-openmpi-dev:1.9
    steps:

    - name: Checkout
      uses: actions/checkout@v2
      with:
        path: da-utils
        submodules: recursive

    - name: Build DA-Utils in a bundle
      shell: bash
      run: |
        export jedi_cmake_ROOT=/opt/view
        source /opt/spack-environment/activate.sh
        cd $GITHUB_WORKSPACE
        mkdir -p Build
        cd Build
        ecbuild -DCLONE_JCSDA_REPOS=ON ../da-utils/bundle
        make -j4
